{% extends 'base.html' %}

{% block content %}
<div class="container">
    <div class="auth-card card border-0 shadow-sm mx-auto">
        <div class="card-body p-4 p-md-5">
            <h1 class="h3 mb-4 text-center">Вход</h1>
            <form method="post">
                <div class="form-floating mb-3">
                    <input class="form-control" id="login" name="login" placeholder="Логин" value="{{ request.form.get('login', '') }}" required>
                    <label for="login">Логин</label>
                </div>
                <div class="form-floating mb-3">
                    <input class="form-control" type="password" id="password" name="password" placeholder="Пароль" required>
                    <label for="password">Пароль</label>
                </div>
                <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox" id="remember_me" name="remember_me">
                    <label class="form-check-label" for="remember_me">Запомнить меня</label>
                </div>
                <button class="btn btn-dark w-100" type="submit">Войти</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
