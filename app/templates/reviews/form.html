{% extends 'base.html' %}

{% block content %}
<div class="container form-container">
    <h1 class="mb-2">Новая рецензия</h1>
    <p class="text-muted mb-4">{{ book.title }}</p>
    <form method="post" class="card border-0 shadow-sm">
        <div class="card-body p-4">
            <div class="mb-3">
                <label class="form-label" for="rating">Оценка</label>
                <select class="form-select {% if errors.get('rating') %}is-invalid{% endif %}" id="rating" name="rating">
                    {% for value, label in rating_options %}
                        <option value="{{ value }}" {% if data.rating|int == value %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
                {% if errors.get('rating') %}<div class="invalid-feedback">{{ errors.rating }}</div>{% endif %}
            </div>
            <div>
                <label class="form-label" for="text">Текст рецензии</label>
                <textarea class="form-control markdown-editor {% if errors.get('text') %}is-invalid{% endif %}" id="text" name="text" rows="10">{{ data.text }}</textarea>
                {% if errors.get('text') %}<div class="invalid-feedback">{{ errors.text }}</div>{% endif %}
            </div>
        </div>
        <div class="card-footer bg-white border-0 p-4 pt-0">
            <button class="btn btn-dark" type="submit">Сохранить</button>
            <a class="btn btn-outline-secondary" href="{{ url_for('books.show', book_id=book.id) }}">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}

{% block scripts %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.css">
<script src="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.js"></script>
<script>
new EasyMDE({element: document.getElementById('text'), spellChecker: false});
</script>
{% endblock %}
